services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
      - /run/base44/app.env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    command: sh -c "bun install && bunx vite dev --host 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/\").then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  node_modules:
