services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install && bun run dev"
    ports:
      - "3000:8080"
    environment:
      # Dev server must bind all interfaces and accept the preview's external host.
      - HOST=0.0.0.0
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
